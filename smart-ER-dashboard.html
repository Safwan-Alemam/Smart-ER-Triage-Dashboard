<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart ER Triage Dashboard — لوحة فرز الطوارئ</title>
<meta name="description" content="لوحة فرز ذكية لتنظيم حالات الطوارئ حسب خطورة الحالة والعمر، مع متابعة وقت الانتظار والتنبيه عند تجاوز الوقت المستهدف." />
<meta name="theme-color" content="#182b43" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --muted-foreground: #6b7280;
  --navy: #182b43;
  --navy-soft: #29415b;
  --coral: #d64c4d;
  --coral-soft: #f9e4df;
  --amber: #c77b26;
  --amber-soft: #faedd6;
  --mint: #3e8773;
  --mint-soft: #e1f0e7;
  --line: #e6ded2;
  --font-sans: 'IBM Plex Sans Arabic', 'Manrope', sans-serif;
  --font-display: 'Manrope', 'IBM Plex Sans Arabic', sans-serif;
}
* { box-sizing: border-box; }
html { min-width: 320px; background: #f5f0e8; }
body {
  margin: 0; min-width: 320px; min-height: 100dvh; color: var(--navy);
  background: radial-gradient(circle at 100% 0%, rgba(224,204,177,.22), transparent 28rem), #f5f0e8;
  font-family: var(--font-sans); -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(214,76,77,.28); outline-offset: 3px; }

.app-shell { min-height: 100dvh; }
.topbar {
  height: 74px; border-bottom: 1px solid var(--line); background: rgba(248,244,237,.82);
  backdrop-filter: blur(14px); display: flex; align-items: center; justify-content: space-between; padding: 0 42px;
}
.brand { display: flex; align-items: center; gap: 13px; }
.brand-mark { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--coral); color: #fff7ef; box-shadow: 0 4px 12px rgba(214,76,77,.23); }
.brand-mark svg { width: 20px; height: 20px; }
.brand-copy { line-height: 1.2; }
.brand-title { font-family: var(--font-display); font-size: 15px; font-weight: 800; letter-spacing: -.03em; }
.brand-subtitle { color: var(--muted-foreground); font-size: 11px; margin-top: 3px; }
.topbar-meta { display: flex; align-items: center; gap: 22px; color: var(--muted-foreground); font-size: 12px; }
.live-indicator { display: flex; align-items: center; gap: 7px; }
.live-dot { width: 7px; height: 7px; background: #56a680; border-radius: 50%; box-shadow: 0 0 0 4px rgba(86,166,128,.13); }
.header-clock { text-align: center; line-height: 1.1; padding-inline-start: 20px; border-inline-start: 1px solid var(--line); }
.header-clock #clock {
  display: block; font-family: var(--font-display); font-size: 20px; font-weight: 800;
  letter-spacing: -.02em; color: var(--navy); direction: ltr;
  font-variant-numeric: tabular-nums; font-feature-settings: 'tnum';
}
.header-clock small { display: block; font-size: 10px; color: var(--muted-foreground); margin-top: 3px; }

.dashboard { max-width: 1440px; margin: 0 auto; padding: 44px 42px 56px; }
.intro-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 34px; }
.eyebrow { display: flex; align-items: center; gap: 10px; color: var(--coral); font-size: 12px; font-weight: 700; letter-spacing: .04em; margin-bottom: 10px; }
.eyebrow-line { display: block; width: 25px; height: 2px; background: var(--coral); border-radius: 4px; }
h1 { font-family: var(--font-display); font-size: clamp(28px,3vw,44px); line-height: 1.14; letter-spacing: -.06em; margin: 0; color: var(--navy); }
.intro-copy { max-width: 560px; color: var(--muted-foreground); font-size: 14px; line-height: 1.8; margin: 10px 0 0; }
.refresh-time { display: flex; align-items: center; gap: 8px; color: var(--muted-foreground); font-size: 12px; white-space: nowrap; }
.refresh-time svg { width: 15px; height: 15px; }

/* ===== بطاقات الملخص — أضفنا بطاقة "تجاوزوا المستهدف" ===== */
.summary-grid { display: grid; grid-template-columns: 1.25fr repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
.summary-card { position: relative; overflow: hidden; min-height: 112px; padding: 18px 20px; border: 1px solid var(--line); border-radius: 14px; background: rgba(250,247,241,.78); }
.summary-card::after { content: ''; position: absolute; bottom: -24px; left: -14px; width: 90px; height: 72px; border-radius: 50%; background: rgba(214,76,77,.05); }
.summary-card.total { background: var(--navy); border-color: var(--navy); color: #f8f4ec; }
.summary-card.total::after { background: rgba(255,255,255,.06); }
.summary-label { position: relative; z-index: 1; font-size: 12px; color: var(--muted-foreground); }
.total .summary-label { color: rgba(248,244,236,.68); }
.summary-value { position: relative; z-index: 1; font-family: var(--font-display); font-size: 37px; font-weight: 800; line-height: 1; margin-top: 20px; letter-spacing: -.07em; }
.summary-foot { position: absolute; left: 20px; bottom: 16px; z-index: 1; font-size: 11px; color: var(--muted-foreground); }
.total .summary-foot { color: rgba(248,244,236,.6); }
.summary-card.critical { border-top: 3px solid var(--coral); }
.summary-card.urgent { border-top: 3px solid var(--amber); }
.summary-card.standard { border-top: 3px solid var(--mint); }
.summary-card.breach { border-top: 3px solid var(--navy-soft); }
.summary-card.critical .summary-value { color: var(--coral); }
.summary-card.urgent .summary-value { color: var(--amber); }
.summary-card.standard .summary-value { color: var(--mint); }
.summary-card.breach .summary-value { color: var(--navy-soft); }
.summary-card.breach.is-active { border-color: var(--coral); background: #fdf4f2; }
.summary-card.breach.is-active .summary-value { color: var(--coral); }

.workspace { display: grid; grid-template-columns: minmax(300px,350px) minmax(0,1fr); gap: 25px; align-items: start; }
.panel { border: 1px solid var(--line); border-radius: 18px; background: rgba(250,247,241,.82); box-shadow: 0 12px 34px rgba(68,53,33,.05); }
.register-panel { padding: 24px; position: sticky; top: 18px; }
.panel-kicker { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.panel-title { font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: -.04em; margin: 0; }
.panel-note { color: var(--muted-foreground); font-size: 12px; line-height: 1.7; margin: 0 0 22px; }
.field { margin-bottom: 17px; }
.field label { display: block; color: var(--navy-soft); font-size: 12px; font-weight: 700; margin-bottom: 8px; }
.label-en { display: block; color: #948a7d; font-family: var(--font-display); font-size: 9px; font-weight: 500; letter-spacing: .04em; margin-top: 2px; direction: ltr; text-align: right; }
.input-wrap { position: relative; }
.input-icon { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); color: #9c9387; pointer-events: none; width: 16px; height: 16px; }
input, select { width: 100%; height: 47px; border: 1px solid #ded4c7; border-radius: 10px; color: var(--navy); background: #fbf8f3; padding: 0 42px 0 13px; transition: border-color .18s, box-shadow .18s; }
select { appearance: none; padding-right: 13px; padding-left: 35px; direction: rtl; }
.select-wrap::after { content: ''; position: absolute; left: 14px; top: 18px; width: 7px; height: 7px; border-right: 1.5px solid var(--navy); border-bottom: 1.5px solid var(--navy); transform: rotate(45deg); pointer-events: none; }
input::placeholder { color: #ada397; }
input:hover, select:hover { border-color: #c7b8a8; }
input:focus, select:focus { border-color: var(--coral); box-shadow: 0 0 0 4px rgba(214,76,77,.09); outline: none; }
input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--coral); }
.error-message { min-height: 17px; color: var(--coral); font-size: 11px; margin-top: 6px; }
.register-button { width: 100%; height: 49px; border: 0; border-radius: 10px; margin-top: 3px; color: #fff8ef; background: var(--coral); font-weight: 700; font-size: 13px; box-shadow: 0 6px 14px rgba(214,76,77,.2); transition: transform .18s, background-color .18s; }
.register-button:hover { background: #bb3d42; transform: translateY(-1px); }
.register-button:active { transform: translateY(1px); }
.register-button svg { width: 16px; height: 16px; vertical-align: -3px; margin-left: 7px; }
.form-footnote { color: #9a8f82; font-size: 10px; line-height: 1.7; margin: 16px 2px 0; }

.queue-header { display: flex; justify-content: space-between; align-items: center; margin: 2px 2px 14px; }
.queue-heading { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.queue-heading h2 { font-family: var(--font-display); font-size: 20px; letter-spacing: -.04em; margin: 0; }
.queue-heading span { color: var(--muted-foreground); font-size: 11px; }
.queue-heading span.has-breach { color: var(--coral); font-weight: 700; }
.sort-note { display: flex; align-items: center; gap: 6px; color: var(--muted-foreground); font-size: 11px; }
.sort-note svg { color: var(--coral); width: 14px; height: 14px; }
.queue-list { display: flex; flex-direction: column; gap: 10px; }
.patient-card {
  display: grid; grid-template-columns: 6px minmax(150px,1.2fr) .75fr .95fr auto;
  gap: 19px; align-items: center; padding: 17px 18px 17px 15px;
  border: 1px solid var(--line); border-radius: 14px; background: #fcf9f4;
  box-shadow: 0 3px 0 rgba(48,34,20,.02); transition: transform .18s, box-shadow .18s;
  animation: card-in .32s both;
}
.patient-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(48,34,20,.08); }
.patient-card.is-breached { background: #fdf4f2; border-color: #e8c4bd; }
.severity-rail { width: 6px; height: 57px; border-radius: 8px; }
.severity-rail.critical { background: var(--coral); }
.severity-rail.urgent { background: var(--amber); }
.severity-rail.standard { background: var(--mint); }
.patient-main { min-width: 0; }
.patient-name { font-size: 15px; font-weight: 700; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
.patient-meta { display: flex; gap: 10px; color: var(--muted-foreground); font-size: 11px; margin-top: 6px; }
.patient-meta span + span { border-right: 1px solid #d9cec1; padding-right: 10px; }
.priority-badge, .waiting-badge { display: inline-flex; align-items: center; width: max-content; border-radius: 6px; padding: 6px 9px; font-size: 11px; font-weight: 700; }
.priority-badge.critical { color: #a63b3c; background: var(--coral-soft); }
.priority-badge.urgent { color: #9c5a16; background: var(--amber-soft); }
.priority-badge.standard { color: #2d6d5d; background: var(--mint-soft); }
.patient-detail-label { color: #9d9388; font-size: 10px; margin-bottom: 5px; }
.patient-detail-value { font-family: var(--font-display); font-size: 13px; font-weight: 700; direction: ltr; text-align: right; }
.waiting-badge { gap: 5px; color: #896a46; background: #f4eadc; font-weight: 600; }
.waiting-badge svg { width: 13px; height: 13px; }

/* ===== مؤشر تجاوز الوقت المستهدف ===== */
.waiting-badge.is-breached { color: #a63b3c; background: var(--coral-soft); animation: breach-pulse 1.8s ease-in-out infinite; }
.target-bar { position: relative; height: 5px; margin-top: 7px; border-radius: 4px; background: #ece2d4; overflow: hidden; }
.target-fill { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 4px; transition: inline-size .9s linear, background-color .4s; }
.target-note { display: block; margin-top: 5px; color: #9d9388; font-size: 10px; }
.target-note.is-breached { color: #a63b3c; font-weight: 700; }

.treat-button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-width: 123px; height: 38px; border: 1px solid #c7ddd2; border-radius: 9px; color: #2f725e; background: #f1f8f3; font-size: 11px; font-weight: 700; transition: background-color .18s, transform .18s; }
.treat-button:hover { background: #e2f0e7; transform: translateY(-1px); }
.treat-button svg { width: 15px; height: 15px; }
.empty-state { text-align: center; padding: 66px 24px; border: 1px dashed #d8cdbf; border-radius: 15px; background: rgba(251,248,243,.53); }
.empty-illustration { width: 68px; height: 68px; display: grid; place-items: center; margin: 0 auto 20px; border-radius: 22px; color: var(--coral); background: var(--coral-soft); }
.empty-illustration svg { width: 31px; height: 31px; }
.empty-state h3 { margin: 0; font-family: var(--font-display); font-size: 18px; letter-spacing: -.04em; }
.empty-state p { max-width: 330px; margin: 9px auto 0; color: var(--muted-foreground); font-size: 12px; line-height: 1.8; }
.empty-state strong { color: var(--coral); }
.disclaimer { display: flex; gap: 9px; align-items: flex-start; margin: 30px 3px 0; color: #968a7c; font-size: 11px; line-height: 1.7; }
.disclaimer svg { flex: 0 0 auto; width: 15px; height: 15px; margin-top: 2px; color: #b49c7f; }
.toast { position: fixed; left: 24px; bottom: 24px; display: flex; align-items: center; gap: 9px; max-width: calc(100vw - 48px); padding: 12px 15px; border: 1px solid #c9ded3; border-radius: 10px; color: #285c4d; background: #eef8f0; box-shadow: 0 10px 24px rgba(38,67,55,.14); font-size: 12px; z-index: 5; animation: toast-in .24s both; }
.toast svg { width: 16px; height: 16px; }
.toast.is-error { color: #8f3033; border-color: #ecc4bc; background: #fff0eb; }
.toast[hidden] { display: none; }
.reset-button { border: 0; background: transparent; color: #9d9388; font-size: 10px; padding: 6px; text-decoration: underline; text-underline-offset: 3px; }
.reset-button:hover { color: var(--coral); }

@keyframes card-in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes breach-pulse { 50% { opacity: .5; } }

@media (max-width: 1100px) { .summary-grid { grid-template-columns: repeat(3, 1fr); } .summary-card.total { grid-column: 1 / -1; min-height: 92px; } }
@media (max-width: 920px) {
  .topbar, .dashboard { padding-left: 24px; padding-right: 24px; }
  .workspace { grid-template-columns: 1fr; }
  .register-panel { position: static; }
  .intro-row { flex-direction: column; align-items: flex-start; }
}
@media (max-width: 640px) {
  .summary-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .summary-value { font-size: 28px; margin-top: 14px; }
  .patient-card { grid-template-columns: 5px minmax(0,1fr) auto; gap: 12px; padding: 14px 12px; }
  .patient-card > .priority-badge { grid-column: 2; grid-row: 2; justify-self: start; }
  .patient-card > .patient-detail { grid-column: 2 / -1; }
  .treat-button { grid-column: 2 / -1; width: 100%; }
  .topbar { height: auto; padding: 14px 18px; flex-wrap: wrap; gap: 10px; }
  .header-clock { padding-inline-start: 12px; }
  .header-clock #clock { font-size: 16px; }
  .header-date { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* =====================================================================
   لوحة الفرز الذكي للطوارئ — Smart ER Triage Dashboard
   الترتيب: الخطورة ← العمر ← الأطول انتظارًا
   الإضافة: وقت مستهدف لكل مستوى + تنبيه عند التجاوز (أساس قياس الـKPIs)
   ===================================================================== */

const STORAGE_KEY = 'smart-er-triage-queue';

const severityRank   = { critical: 0, urgent: 1, standard: 2 };
const severityLabels = { critical: 'حرج — Critical', urgent: 'عاجل — Urgent', standard: 'قياسي — Standard' };

/* الوقت المستهدف بالدقائق — مصدره بروتوكول المستشفى، وليس النظام */
const severityTarget = { critical: 5, urgent: 15, standard: 60 };
const severityColor  = { critical: 'var(--coral)', urgent: 'var(--amber)', standard: 'var(--mint)' };

const icons = {
  pulse: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2.2-6 4.1 12 2.3-6H21"/><path d="M12 21a9 9 0 1 1 9-9"/></svg>',
  user:  '<svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.5-3.3 3-5.2 7-5.2s6.5 1.9 7 5.2"/></svg>',
  plus:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4.2 4.2L19 6.5"/></svg>',
  sort:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M8 12h11M11 17h8"/></svg>',
  info:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10.5v5M12 7.5h.01"/></svg>',
  rotate:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.8-3.9L3 9"/><path d="M3 4.5V9h4.5"/><path d="M4 13a8 8 0 0 0 14.8 3.9L21 15"/><path d="M21 19.5V15h-4.5"/></svg>',
};

/* ---------- التخزين ---------- */
function readPatients() {
  let list;
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    list = saved ? JSON.parse(saved) : seedPatients();
  } catch { list = seedPatients(); }
  return rebaseDemo(list);
}

/* الحالات التجريبية تحمل "waitMinutes" ثابتة، ويُعاد حساب وقت وصولها عند كل فتح
   للصفحة — حتى تبقى أرقام العرض كما هي ولا تتضخم مع مرور الوقت.
   الحالات التي يسجّلها المستخدم لا تتأثر بهذا. */
function rebaseDemo(list) {
  const now = Date.now();
  return list.map(p => p.waitMinutes != null
    ? { ...p, registeredAt: now - p.waitMinutes * 60000 }
    : p);
}

/* بيانات تجريبية تظهر أول مرة، حتى لا تكون الشاشة فارغة أثناء العرض.
   الأوقات موزّعة عمدًا: بعضها ضمن المستهدف وبعضها متجاوز. */
function seedPatients() {
  return [
    { id: 's1', name: 'عبدالله محمد',  age: 67, severity: 'critical', waitMinutes:  3 },
    { id: 's2', name: 'محمد العتيبي',  age: 34, severity: 'urgent',   waitMinutes: 23 },
    { id: 's3', name: 'نورة القحطاني', age: 71, severity: 'urgent',   waitMinutes: 12 },
    { id: 's4', name: 'سارة الحربي',   age: 81, severity: 'standard', waitMinutes: 42 },
    { id: 's5', name: 'خالد الشهري',   age: 29, severity: 'standard', waitMinutes: 10 },
    { id: 's6', name: 'فهد الدوسري',   age: 45, severity: 'standard', waitMinutes: 73 },
  ].map(p => ({ ...p, registeredAt: Date.now() - p.waitMinutes * 60000 }));
}
function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(patients)); } catch {}
}

let patients = readPatients();
let toastTimer;

/* ---------- الترتيب: الخطورة ← العمر ← الأطول انتظارًا ---------- */
function sortedPatients() {
  return [...patients].sort((a, b) =>
    severityRank[a.severity] - severityRank[b.severity] ||
    b.age - a.age ||
    a.registeredAt - b.registeredAt
  );
}

/* ---------- الوقت المستهدف والتجاوز ---------- */
function waitedMinutes(registeredAt) { return Math.max(0, Math.floor((Date.now() - registeredAt) / 60000)); }
function isBreached(p) { return waitedMinutes(p.registeredAt) > severityTarget[p.severity]; }
function targetPercent(p) {
  const target = severityTarget[p.severity];
  if (target === 0) return 100;
  return Math.min(100, (waitedMinutes(p.registeredAt) / target) * 100);
}

/* ---------- أدوات ---------- */
function escapeHtml(v) {
  return String(v).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[c]));
}
function formatWaiting(registeredAt) {
  const m = waitedMinutes(registeredAt);
  if (m < 1) return 'أقل من دقيقة';
  if (m < 60) return `${m} دقيقة`;
  const h = Math.floor(m / 60), rest = m % 60;
  return rest ? `${h} س و ${rest} د` : `${h} ساعة`;
}
function formatRegisteredAt(ts) { return new Intl.DateTimeFormat('ar-SA', { hour:'2-digit', minute:'2-digit' }).format(ts); }
function nowLabel() { return new Intl.DateTimeFormat('ar-SA', { weekday:'long', day:'numeric', month:'long' }).format(new Date()); }

function showToast(message, isError = false) {
  const toast = document.querySelector('#toast');
  if (!toast) return;
  toast.className = `toast${isError ? ' is-error' : ''}`;
  toast.innerHTML = `${isError ? icons.info : icons.check}<span>${escapeHtml(message)}</span>`;
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; }, 3200);
}

/* ---------- بطاقة المريض ---------- */
function patientCard(patient, index) {
  const breached = isBreached(patient);
  const target   = severityTarget[patient.severity];
  const pct      = targetPercent(patient);
  const color    = breached ? 'var(--coral)' : severityColor[patient.severity];
  return `
    <article class="patient-card${breached ? ' is-breached' : ''}" style="animation-delay:${index * 45}ms">
      <span class="severity-rail ${patient.severity}" aria-hidden="true"></span>
      <div class="patient-main">
        <div class="patient-name">${escapeHtml(patient.name)}</div>
        <div class="patient-meta"><span>${patient.age} سنة</span><span>وصول ${formatRegisteredAt(patient.registeredAt)}</span></div>
      </div>
      <span class="priority-badge ${patient.severity}">${severityLabels[patient.severity]}</span>
      <div class="patient-detail">
        <div class="patient-detail-label">وقت الانتظار ${target ? `· المستهدف ${target} دقيقة` : '· فوري'}</div>
        <div class="waiting-badge${breached ? ' is-breached' : ''}">${icons.clock}<span>${formatWaiting(patient.registeredAt)}</span></div>
        <div class="target-bar"><span class="target-fill" style="inline-size:${pct}%;background:${color}"></span></div>
        <span class="target-note${breached ? ' is-breached' : ''}">${breached ? 'تجاوز الوقت المستهدف' : 'ضمن الوقت المستهدف'}</span>
      </div>
      <button class="treat-button" type="button" data-treat-id="${patient.id}">
        ${icons.check}<span>تمت المعالجة</span>
      </button>
    </article>`;
}

/* ---------- الرسم ---------- */
function render() {
  const ordered = sortedPatients();
  const counts = {
    total: ordered.length,
    critical: ordered.filter(p => p.severity === 'critical').length,
    urgent: ordered.filter(p => p.severity === 'urgent').length,
    standard: ordered.filter(p => p.severity === 'standard').length,
    breached: ordered.filter(isBreached).length,
  };
  const queue = document.querySelector('#queue-content');
  if (!queue) return;

  document.querySelector('#count-total').textContent    = counts.total;
  document.querySelector('#count-critical').textContent = counts.critical;
  document.querySelector('#count-urgent').textContent   = counts.urgent;
  document.querySelector('#count-standard').textContent = counts.standard;
  document.querySelector('#count-breached').textContent = counts.breached;
  document.querySelector('#card-breached').classList.toggle('is-active', counts.breached > 0);

  const queueCount = document.querySelector('#queue-count');
  queueCount.textContent = counts.total
    ? `${counts.total} حالات قيد الانتظار${counts.breached ? ` · ${counts.breached} تجاوزوا الوقت المستهدف` : ' · الكل ضمن الوقت المستهدف'}`
    : 'لا توجد حالات قيد الانتظار';
  queueCount.classList.toggle('has-breach', counts.breached > 0);

  queue.innerHTML = ordered.length
    ? `<div class="queue-list">${ordered.map(patientCard).join('')}</div>`
    : `<div class="empty-state">
        <div class="empty-illustration">${icons.pulse}</div>
        <h3>الطابور خالٍ حالياً</h3>
        <p>لا توجد حالات تنتظر الفرز. ابدأ بتسجيل حالة جديدة، وستظهر هنا مرتبة حسب <strong>الخطورة ثم العمر</strong>.</p>
      </div>`;

  queue.querySelectorAll('[data-treat-id]').forEach(button => {
    button.addEventListener('click', () => {
      const patient = patients.find(p => p.id === button.dataset.treatId);
      if (!patient) return;
      if (!confirm(`تأكيد إنهاء حالة ${patient.name}؟`)) return;
      patients = patients.filter(p => p.id !== patient.id);
      persist(); render();
      showToast(`تم إنهاء حالة ${patient.name} وإزالتها من الطابور`);
    });
  });
}

/* ---------- التهيئة ---------- */
function setup() {
  document.querySelector('#today').textContent = nowLabel();

  /* الساعة تعمل باستمرار وتتحدث كل ثانية */
  const clockEl = document.querySelector('#clock');
  function tickClock() {
    const d = new Date();
    clockEl.textContent = [d.getHours(), d.getMinutes(), d.getSeconds()]
      .map(n => String(n).padStart(2, '0')).join(':');
  }
  tickClock();
  setInterval(tickClock, 1000);
  const form = document.querySelector('#register-form');
  const nameInput = document.querySelector('#patient-name');
  const ageInput = document.querySelector('#patient-age');
  const severityInput = document.querySelector('#severity');
  const formError = document.querySelector('#form-error');

  form.addEventListener('submit', event => {
    event.preventDefault();
    formError.textContent = '';
    [nameInput, ageInput, severityInput].forEach(i => i.removeAttribute('aria-invalid'));

    const name = nameInput.value.trim();
    const age = Number(ageInput.value);
    let valid = true;
    if (!name) { nameInput.setAttribute('aria-invalid','true'); valid = false; }
    if (!Number.isInteger(age) || age < 0 || age > 120) { ageInput.setAttribute('aria-invalid','true'); valid = false; }
    if (!severityInput.value) { severityInput.setAttribute('aria-invalid','true'); valid = false; }
    if (!valid) {
      formError.textContent = 'يرجى إدخال اسم المريض وعمر صحيح واختيار مستوى الخطورة.';
      showToast('تحقق من الحقول المطلوبة قبل التسجيل', true);
      return;
    }

    patients = [...patients, {
      id: `${Date.now()}-${Math.random().toString(36).slice(2,7)}`,
      name, age, severity: severityInput.value, registeredAt: Date.now(),
    }];
    persist(); render();
    form.reset(); nameInput.focus();
    showToast(`تم تسجيل ${name} في الطابور حسب الأولوية`);
  });

  document.querySelector('#reset-button').addEventListener('click', () => {
    if (!confirm('سيتم استرجاع البيانات التجريبية وحذف الحالات الحالية. هل تريد المتابعة؟')) return;
    patients = seedPatients(); persist(); render();
    showToast('تم استرجاع البيانات التجريبية');
  });

  render();
  /* إعادة رسم كل 30 ثانية حتى تتحدث أوقات الانتظار وحالة التجاوز معًا */
  setInterval(() => { patients = rebaseDemo(patients); render(); }, 30000);
}
